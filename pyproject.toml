[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-rans"
dynamic = ["version"]
description = "Differentiable compressible RANS in JAX: Euler, laminar Navier-Stokes and Spalart-Allmaras on structured multi-block grids, 2D and 3D, on GPUs"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "giovannicatalani" }]
requires-python = ">=3.11"
dependencies = [
    "jax[cuda13]>=0.4.30",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "scipy>=1.10",
]
keywords = ["CFD", "aerodynamics", "JAX", "RANS", "Spalart-Allmaras", "airfoil", "wing", "GPU", "differentiable", "adjoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/giovannicatalani/jax-rans"
Documentation = "https://giovannicatalani.github.io/jax-rans/"
Repository = "https://github.com/giovannicatalani/jax-rans"
Issues = "https://github.com/giovannicatalani/jax-rans/issues"

[project.scripts]
jaxrans = "jaxrans.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "sympy>=1.12", "build>=1", "pyflakes>=3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9,<10"]
plot = ["matplotlib>=3.7"]
cgns = ["h5py>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "jaxrans.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: verification tests that take minutes",
]
