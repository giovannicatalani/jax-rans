name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,cgns]"
      - run: pyflakes src
      # The validation O-grids are ours: write them. Third-party grids are not in
      # the repository, and the tests that read them skip.
      - run: python validation/grids/make_grids.py
      - run: pytest -q -m "not slow"

  notebook:
    # The quickstart, executed top to bottom on CPU, so it cannot rot; the
    # checkout is installed first, so its install cell is skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[plot]" nbclient ipykernel
      - run: >-
          python -c "import nbformat, nbclient;
          nb = nbformat.read('notebooks/quickstart.ipynb', as_version=4);
          nbclient.NotebookClient(nb, timeout=3000, resources={'metadata': {'path': 'notebooks'}}).execute()"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
